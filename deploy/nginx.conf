# nginx de dentro do contêiner. Serve só arquivos estáticos, na porta 8080, sem root.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # O jogo não carrega nada de fora nem tem script ou estilo embutido: a política pode ser estrita.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location = /saude {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Arquivos com hash no nome nunca mudam: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  # Página, manifesto e service worker: sempre revalidar, para a atualização chegar.
  # no-transform: nenhum proxy ou CDN no caminho deve alterar a página (por exemplo, injetar script).
  location / {
    add_header Cache-Control "no-cache, no-transform" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri $uri/ =404;
  }

  # Só leitura: qualquer outro método é recusado.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }
}
